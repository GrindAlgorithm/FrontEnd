<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GrindAlgorithm</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    />
    <style>
      /* 코드 표시엔 합자를 끈다 — JetBrains Mono 가 <= != -> 를 ≤ ≠ → 한 글자로 그려 원문과 달라 보인다.
         IDE 에디터(CodeMirror)는 CodeEditor 테마에서 같은 설정을 한다. */
      pre,
      code {
        font-variant-ligatures: none;
        font-feature-settings: 'liga' 0, 'calt' 0;
      }
      /* 알림 항목 — 인라인 배경(읽음/안 읽음) 위에 호버·키보드 포커스 표시 */
      .notif-item:hover {
        filter: brightness(1.3);
      }
      .notif-item:focus-visible {
        outline: 2px solid #3fb950;
        outline-offset: -2px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
